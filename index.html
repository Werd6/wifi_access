ke{0%{transform:translate(4px,2px)}50%{transform:translate(-5px,-3px)}100%{transform:translate(2px,4px)}}.fine{font-size:12px;color:#9daecb;margin-top:18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{margin:0;padding:13px 5px}.qr{background:white;padding:13px;border-radius:12px;width:max-content;max-width:100%;margin:15px auto}.qr img{width:220px;max-width:100%;display:block}.error{color:#ff9a9a}.success{color:#8eeac4}

</style></head><body><main><header><div class="logo">📶</div><div><strong>Guest Network</strong><div class="muted">Secure access gateway · WPA2/WPA3</div></div></header><div id="screen"></div><div class="fine center">Guest network portal · Connection services</div></main><script>
const $=document.getElementById('screen');
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const btn=(label,fn,cls='')=>{const b=document.createElement('button');b.textContent=label;b.className=cls;b.addEventListener('click',fn);return b};
const set=html=>{$.innerHTML=html};
const LOCK='wifiLock';
const getLock=()=>{try{return JSON.parse(localStorage.getItem(LOCK))}catch(e){return null}};
const saveLock=l=>{try{localStorage.setItem(LOCK,JSON.stringify(l))}catch(e){}};
const clearLock=()=>{try{localStorage.removeItem(LOCK)}catch(e){}};
function enterRigged(name){let l=getLock();if(!l||l.game!==name){l={game:name,losses:0,since:Date.now()};saveLock(l)}return l}
function lost(name,retry){
  const l=enterRigged(name);l.losses++;saveLock(l);
  const note=document.createElement('p');note.className='center muted';
  note.textContent=l.losses<3?`Losses: ${l.losses}/3. Lose 3 times to unlock a different challenge.`:'A different challenge is now unlocked. Or keep losing. Your call.';
  $.append(note,btn('Try again',retry));
  if(l.losses>=3)$.append(btn('Try a new challenge',()=>{clearLock();randomPrank(name)},'secondary'));
}
function finish(){clearLock();document.body.classList.remove('shaky');set(`<div class="tag">Challenge complete</div><h1 class="success">✓ Guest Access Approved</h1><p>Congratulations. Your dignity was a small price to pay.</p><div class="panel center"><div class="big">📶</div><h2>Ask Drew for the WiFi.</h2><p class="muted">Only Drew can give you the password.</p></div>`);$.append(btn('See the Hall of Fame',()=>{location.href='gallery.html'}),btn('Try another challenge',randomPrank,'secondary'));}
function face(){
  set(`<div class="tag">Identity verification</div><h1>Facial Recognition Required</h1><p>To request guest WiFi, allow camera access and take a selfie for our very serious face scan.</p><div class="panel center" id="camBox"><div class="big">📷</div><p>Camera is off</p></div><p class="fine">Heads up: your selfie gets saved to the Hall of Fame for other guests to admire.</p>`);
  const box=document.getElementById('camBox');
  $.append(btn('Enable camera',async()=>{
    const skip=()=>{if(!document.getElementById('skipFace')){const s=btn('Skip the face scan',randomPrank,'secondary');s.id='skipFace';$.append(s)}};
    if(!navigator.mediaDevices?.getUserMedia){box.innerHTML='<p class="error">Camera access is unavailable. Open this site over HTTPS on your phone.</p>';skip();return}
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})}
    catch(e){box.innerHTML='<p class="error">Camera permission was not granted. Allow camera access in your browser to continue.</p>';skip();return}
    if(!box.isConnected){stream.getTracks().forEach(t=>t.stop());return}
    box.replaceChildren();
    const video=document.createElement('video');video.autoplay=true;video.playsInline=true;video.muted=true;video.srcObject=stream;box.append(video);
    const capture=btn('Take my picture',async()=>{
      if(!video.videoWidth){return}
      const canvas=document.createElement('canvas');canvas.width=320;canvas.height=Math.round(320*video.videoHeight/video.videoWidth);
      canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
      canvas.toBlob(jpg=>{if(jpg)fetch('api/selfie',{method:'POST',headers:{'content-type':'image/jpeg'},body:jpg}).catch(err=>console.warn('Selfie upload failed:',err))},'image/jpeg',0.75);
      stream.getTracks().forEach(t=>t.stop());video.srcObject=null;
      box.replaceChildren();const photo=document.createElement('img');photo.id='selfie';photo.alt='Selfie captured on this device';photo.src=canvas.toDataURL('image/jpeg',0.75);box.append(photo);
      capture.remove();
      const verify=btn('Scan my face',async()=>{
        set('<div class="tag">Analyzing facial structure</div><h1>Face scan in progress…</h1><div class="bar"><div class="fill" id="fill"></div></div><p>Checking biometric confidence…</p>');
        for(let i=0;i<=100;i+=10){document.getElementById('fill').style.width=i+'%';await delay(180)}
        const insults=['Face recognized. Unfortunately, so is the disappointment.','Biometrics passed. Your haircut did not.','Identity confirmed. The router wishes it had not looked.','Face detected. Confidence in your life choices: 2%.','Your face is valid. Your vibes are not.'];
        set(`<div class="tag error">Facial evaluation complete</div><div class="big">🤨</div><h1>Chud Detected.</h1><p>${insults[Math.floor(Math.random()*insults.length)]}</p>`);
        $.append(btn('Accept humiliation & continue',randomPrank));
      });$.append(verify);
    });$.append(capture);
  }));
}
function goat(){
  set('<div class="tag">Connecting</div><h1>Establishing secure connection…</h1><p>Tap below to authenticate with the network.</p>');
  $.append(btn('Connect to WiFi',async()=>{
    // Prepare the actual goat recording during the user gesture. This makes
    // playback at the reveal more reliable on browsers with autoplay rules.
    let ctx=null, clip=null;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      await ctx.resume();
      const response=await fetch('pony.mp3');
      if(!response.ok)throw new Error('pony.mp3 missing');
      clip=await ctx.decodeAudioData(await response.arrayBuffer());
    }catch(err){console.warn('Could not prepare pony.mp3:',err)}
    set('<div class="tag">Network handshake</div><h1>Connecting…</h1><div class="bar"><div class="fill" id="fill"></div></div><p id="status">Authenticating device…</p>');
    for(let i=0;i<=99;i+=3){document.getElementById('fill').style.width=i+'%';await delay(55)}
    set('<div id="goat" class="center">🐐</div><h1 class="center">AAAAAAAAAAAA!</h1><p class="center">YOU HAVE BEEN GOATED.</p>');
    document.body.classList.add('shaky');
    if(ctx&&clip){
      try{const source=ctx.createBufferSource();source.buffer=clip;source.connect(ctx.destination);source.start();}
      catch(err){console.warn('Goat playback failed:',err)}
    }else{
      // Fallback where AudioContext loading isn't available.
      const sound=new Audio('pony.mp3');sound.play().catch(()=>{});
    }
    await delay(1800);
    document.body.classList.remove('shaky');
    $.append(btn('I survived. Continue.',finish));
  }));
}
function shake(){let n=0,last=0,prev=0,active=true;
set('<div class="tag">Signal calibration</div><h1>Shake to Connect</h1><p>The router requires manual kinetic energy. Shake your phone to generate WiFi signal.</p><div class="big">📱</div><div class="bar"><div class="fill" id="fill"></div></div><p class="center" id="count">0% signal generated</p>');
function update(){if(!active)return;n=Math.min(100,n+8);document.getElementById('fill').style.width=n+'%';document.getElementById('count').textContent=n+'% signal generated';if(n===100){active=false;window.removeEventListener('devicemotion',motion);set('<div class="big">🎉</div><h1>Signal restored!</h1><p>Congratulations. You have successfully shaken your phone. The router is deeply impressed.</p>');$.append(btn('Continue',finish));}}
function motion(e){if(!active)return;const a=e.accelerationIncludingGravity;if(!a)return;const mag=Math.hypot(a.x||0,a.y||0,a.z||0),now=Date.now();if(Math.abs(mag-prev)>8&&now-last>240){last=now;update()}prev=mag}
window.addEventListener('devicemotion',motion);
if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){$.append(btn('Enable motion detection',async()=>{try{const p=await DeviceMotionEvent.requestPermission();if(p!=='granted')alert('Motion permission required to complete calibration.')}catch(e){alert('Motion access is unavailable on this browser.')}}));}
}
function captcha(){
  let round=0;
  // Twenty intentionally nonsensical checks. Every answer is "wrong" by design.
  const puzzles=[
    ['Select all squares containing emotional damage',['Monday','A tax return','A sad potato','Your last exam']],
    ['Prove you are not three raccoons in a trench coat',['I am one raccoon','I am two raccoons','I am human, allegedly','Nice try, officer']],
    ['Which image contains the correct WiFi password?',['🥔','🥔','🥔','🥔']],
    ['Select the square with the most WiFi',['A brick','A confused duck','A screaming microwave','The concept of Tuesday']],
    ['Which of these is NOT a traffic light?',['A red circle','A green circle','A suspicious banana','The color Wednesday']],
    ['Identify all objects currently thinking about you',['Your toaster','The moon','A parking meter','Your left sock']],
    ['Which animal is secretly in charge of the internet?',['A pigeon','Two pigeons','A pigeon in a suit','A really tall pigeon']],
    ['Select the image that best represents trust',['A wet handshake','A locked door','A raccoon with a key','A free airport charger']],
    ['Which of these is a bicycle?',['A unicycle','A tricycle','A disappointed motorcycle','A horse with wheels']],
    ['How many triangles can you hear?',['3','Blue','Too many','Please stop']],
    ['Select the most suspicious vegetable',['An undercover carrot','An evasive cucumber','A nervous onion','A potato with a badge']],
    ['Confirm that you are not a robot',['Beep','Boop','Affirmative, human','I love taxes']],
    ['Which square contains a crosswalk?',['A zebra','A striped sock','A barcode','An extremely straight snake']],
    ['Identify all signs of intelligent life',['A group chat','A printer error','A confused duck','A WiFi router']],
    ['Which answer is definitely correct?',['None of these','All of these','Only this one','Ask the other buttons']],
    ['Select the picture of a bus',['A large loaf','A very long car','A rectangle with dreams','A school of fish']],
    ['Solve the security equation: goat + WiFi = ?',['Screaming internet','GoatFi','404: grass not found','A very loud router']],
    ['Which object contains at least one pixel?',['An invisible JPEG','An imaginary monitor','A printed cloud','A wireless potato']],
    ['Select all squares that are not squares',['This square','That square','The other square','Square number four']],
    ['Final verification: choose the correct answer',['Try again','Definitely wrong','Incorrect','This is also wrong']]
  ];
  function show(){
    const [question,options]=puzzles[round];
    set(`<div class="tag">Human verification · ${round+1}/${puzzles.length}</div><h1>Verify you're human</h1><p>${question}</p><div class="choices" id="choices"></div><p class="muted">Unusual traffic detected. Verification required.</p>`);
    const box=document.getElementById('choices');
    options.forEach(o=>box.append(btn(o,()=>{
      round++;
      if(round>=puzzles.length){
        set('<div class="big">🤖</div><h1>Verification failed successfully.</h1><p>After 20 checks, we still cannot confirm that you are not a highly sophisticated raccoon. Fortunately, the router has given up.</p>');
        $.append(btn('Accept defeat & continue',finish));
      }else{
        const failures=['Incorrect.','Suspicious answer detected.','Humanity score: inconclusive.','That is exactly what a robot would say.','Verification almost definitely failed.'];
        set(`<h1 class="error">${failures[(round-1)%failures.length]}</h1><p>Please complete the next completely reasonable verification challenge.</p>`);
        setTimeout(show,850);
      }
    })));
  }
  show();
}
function history(){set('<div class="tag">Guest network</div><h1>Connect to WiFi?</h1><p>Tap below to connect to the guest network.</p>');$.append(btn('Connect to WiFi',async()=>{set('<h1>Scanning Search History</h1><div class="bar"><div class="fill" id="fill"></div></div>');for(let i=0;i<=100;i+=5){document.getElementById('fill').style.width=i+'%';await delay(85)}set('<div class="big">🤨</div><h1>Wow, that was pretty weird bro.</h1>');$.append(btn('Continue',finish));}));}
function ttt(){
  enterRigged('ttt');
  const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const b=Array(9).fill('');let over=false;
  set('<div class="tag">Network game</div><h1>Beat the Router at Tic Tac Toe</h1><p>Win one game and the WiFi is yours. You are X.</p><div class="board" id="board"></div><p class="center" id="msg">Your move.</p>');
  const board=document.getElementById('board'),msg=document.getElementById('msg');
  const cells=b.map((_,i)=>{const c=btn('',()=>play(i));board.append(c);return c});
  const draw=()=>cells.forEach((c,i)=>{c.textContent=b[i];c.disabled=over||!!b[i]});
  const winner=p=>lines.find(l=>l.every(i=>b[i]===p));
  const empty=()=>b.map((v,i)=>v?-1:i).filter(i=>i>=0);
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  function best(){for(const p of['O','X'])for(const l of lines){const e=l.filter(i=>!b[i]);if(e.length===1&&l.filter(i=>b[i]===p).length===2)return e[0]}return b[4]?pick(empty()):4}
  function end(text){over=true;draw();msg.textContent=text.trim();lost('ttt',ttt)}
  async function play(i){
    if(over||b[i])return;b[i]='X';over=true;draw();let cheat='';
    if(winner('X')){
      await delay(550);
      while(winner('X')){
        const v=pick(winner('X'));
        const spots=empty().filter(s=>{b[v]='';b[s]='X';const ok=!winner('X');b[s]='';b[v]='X';return ok});
        if(spots.length&&Math.random()<.5){b[v]='';b[pick(spots)]='X';cheat='Your X slipped. Physics, probably.'}
        else{b[v]='O';cheat='Your X has defected.'}
      }
      msg.textContent=cheat;draw();await delay(900);
    }else await delay(350);
    if(!board.isConnected)return;
    if(winner('O'))return end(cheat+' The router wins again.');
    if(!empty().length)return end(cheat+' Draw. Ties go to the house. The router wins again.');
    b[best()]='O';
    if(winner('O'))return end(cheat+' The router wins again.');
    if(!empty().length)return end(cheat+' Draw. Ties go to the house. The router wins again.');
    over=false;draw();msg.textContent=cheat?cheat+' Your move.':'Your move.';
  }
  draw();
}
function rps(){
  enterRigged('rps');
  const beats={Rock:'Paper',Paper:'Scissors',Scissors:'Rock'},icon={Rock:'🪨',Paper:'📄',Scissors:'✂️'};
  let losses=0,target=2;
  function show(note){
    set(`<div class="tag">Network duel · Best of ${target*2-1}</div><h1>Rock, Paper, Scissors</h1><p>Win the match and the router hands over the WiFi.</p><div class="panel center"><div style="font-size:48px" id="rpsPlay">❔</div><p id="rpsMsg">${note||'Choose your weapon.'}</p><p class="muted">You 0 · Router ${losses}</p></div><div class="choices" id="choices" style="grid-template-columns:repeat(3,1fr)"></div>`);
    const box=document.getElementById('choices');
    Object.keys(beats).forEach(k=>box.append(btn(icon[k]+' '+k,async()=>{
      box.querySelectorAll('button').forEach(x=>x.disabled=true);
      const play=document.getElementById('rpsPlay'),msg=document.getElementById('rpsMsg');
      play.textContent=icon[k]+' vs ❔';await delay(600);
      const r=beats[k];play.textContent=icon[k]+' vs '+icon[r];losses++;
      msg.textContent=`${r} beats ${k}. Router wins the round.`;
      await delay(1200);if(!box.isConnected)return;
      if(losses===1&&target===2){target=3;return show('Rule update: this is now best of 5.')}
      if(losses>=target){set(`<div class="big">🏆</div><h1>Router wins ${losses}-0.</h1><p>The router read your mind. It does that.</p>`);lost('rps',rps);return}
      show();
    })));
  }
  show();
}
function maze(){
  const lock=enterRigged('maze');
  const g=['#########','#...#...#','#.#.#.#.#','#.#...#.#','#.#####.#','#...#...#','###.#.#.#','#.....#.#','#########'].map(r=>[...r]);
  let pos=[1,1],exits=[[0,7],[4,8],[8,1],[0,3]],exit=[8,7],timer;g[8][7]='E';
  set('<div class="tag">Network routing</div><h1>Find the Exit</h1><p>Guide your packet 🔵 to the exit 🚪 to connect. Use the arrows or your keyboard.</p><div class="mazegrid" id="mz" style="grid-template-columns:repeat(9,1fr)"></div><p class="center" id="mzMsg">Packet ready.</p><div class="pad" id="pad"></div><p class="center muted" id="mzTimer"></p>');
  const mz=document.getElementById('mz'),msg=document.getElementById('mzMsg'),pad=document.getElementById('pad'),timerEl=document.getElementById('mzTimer');
  const draw=()=>{mz.innerHTML=g.map((r,y)=>r.map((c,x)=>`<div class="${c==='#'?'wall':''}">${y===pos[0]&&x===pos[1]?'🔵':c==='E'?'🚪':''}</div>`).join('')).join('')};
  const near=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1;
  function move(dy,dx){
    if(!mz.isConnected)return;
    const n=[pos[0]+dy,pos[1]+dx];if(g[n[0]]?.[n[1]]!=='.')return;pos=n;
    if(near(pos,exit)){
      g[exit[0]][exit[1]]='#';
      const options=exits.filter(e=>!near(pos,e));
      if(options.length){exit=options[Math.floor(Math.random()*options.length)];exits=exits.filter(e=>e!==exit);g[exit[0]][exit[1]]='E';msg.textContent='The exit has been relocated for your security.'}
      else{exit=[-9,-9];msg.textContent='All exits have been permanently relocated. Into the void.'}
    }
    draw();
  }
  function key(e){if(!mz.isConnected){removeEventListener('keydown',key);return}const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(d){e.preventDefault();move(...d)}}
  addEventListener('keydown',key);
  [[null],['↑',-1,0],[null],['←',0,-1],['↓',1,0],['→',0,1]].forEach(([label,dy,dx])=>pad.append(label?btn(label,()=>move(dy,dx),'secondary'):document.createElement('div')));
  function tick(){
    if(!mz.isConnected)return clearInterval(timer);
    const left=Math.ceil((lock.since+60000-Date.now())/1000);
    if(left>0){timerEl.textContent=`A different challenge unlocks in ${left}s`;return}
    clearInterval(timer);timerEl.textContent='';
    $.append(btn('Try a new challenge',()=>{removeEventListener('keydown',key);clearLock();randomPrank('maze')},'secondary'));
  }
  timer=setInterval(tick,1000);tick();
  draw();
}
function slots(){
  enterRigged('slots');
  const sym=['🍒','🍋','🔔','⭐','💎','7️⃣'],pick=()=>sym[Math.floor(Math.random()*sym.length)];
  const misses=['So close!','Almost! The third reel slipped.','Unlucky. Statistically impossible, but unlucky.','The machine is definitely not rigged.'];
  let credits=5;
  set('<div class="tag">Bandwidth casino</div><h1>Spin to Win WiFi</h1><p>Line up three of a kind to win the password.</p><div class="reels" id="reels"><span>🍒</span><span>🔔</span><span>💎</span></div><p class="center" id="slMsg">Good luck. You\'ll need it.</p><p class="center muted" id="cr">Credits: 5</p>');
  const reels=[...document.querySelectorAll('#reels span')],msg=document.getElementById('slMsg'),cr=document.getElementById('cr');
  const spin=btn('Spin (1 credit)',async()=>{
    if(spin.disabled||!credits)return;spin.disabled=true;credits--;cr.textContent='Credits: '+credits;msg.textContent='Spinning…';
    for(let i=0;i<14;i++){if(!spin.isConnected)return;reels.forEach(r=>r.textContent=pick());await delay(70)}
    if(!spin.isConnected)return;
    if(!credits){
      reels.forEach(r=>r.textContent='💎');msg.innerHTML='<strong class="success">JACKPOT!!!</strong> You win: 0.00 WiFi.';
      await delay(2000);if(!spin.isConnected)return;
      set('<div class="big">🎰</div><h1>Out of credits.</h1><p>The house thanks you for your generous donation of dignity.</p>');lost('slots',slots);return;
    }
    const a=pick();let b;do b=pick();while(b===a);
    [a,a,b].forEach((s,i)=>reels[i].textContent=s);
    msg.textContent=misses[4-credits];spin.disabled=false;
  });
  $.append(spin);
}
function runaway(){
  let dodges=0,tired=false;
  const taunts=['Nope.','Too slow.','Missed me!','Almost.','Are you even trying?','So close.','Ha.','Try the other side.'];
  set('<div class="tag">Connection</div><h1>Connect to WiFi</h1><p>Just press the button. That\'s all.</p><div class="arena" id="arena"></div><p class="center muted" id="rnMsg">&nbsp;</p>');
  const arena=document.getElementById('arena'),msg=document.getElementById('rnMsg');
  const b=btn('Connect to WiFi',()=>tired?finish():hop());
  const place=(x,y)=>{b.style.left=Math.max(0,Math.min(x,arena.clientWidth-b.offsetWidth))+'px';b.style.top=Math.max(0,Math.min(y,arena.clientHeight-b.offsetHeight))+'px'};
  function hop(){
    if(tired)return;dodges++;
    if(dodges>=12){tired=true;b.textContent='Fine. Click me.';msg.textContent='The button is exhausted.';place(b.offsetLeft,b.offsetTop);return}
    let x,y;do{x=Math.random()*(arena.clientWidth-b.offsetWidth);y=Math.random()*(arena.clientHeight-b.offsetHeight)}while(Math.hypot(x-b.offsetLeft,y-b.offsetTop)<90);
    place(x,y);msg.textContent=taunts[dodges%taunts.length];
  }
  b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hop()});
  arena.append(b);place((arena.clientWidth-b.offsetWidth)/2,(arena.clientHeight-b.offsetHeight)/2);
}
function tos(){

  const box=document.getElementById('tos'),pct=document.getElementById('tosPct');
  function more(){for(let i=0;i<6;i++){n++;const p=document.createElement('p');p.textContent=`${n}. ${clauses[(n-1)%clauses.length]}`;box.append(p)}}
  more();more();
  box.addEventListener('scroll',()=>{
    pct.textContent=Math.min(99,Math.floor((box.scrollTop+box.clientHeight)/box.scrollHeight*100))+'% read';
    if(box.scrollTop+box.clientHeight<box.scrollHeight-40)return;
    more();
    if(++batches===12)$.append(btn('I agree (I did not read this)',finish));
  });
}
function invasive(){
  const fields=[['Full legal name (including the embarrassing middle one)','text'],['Social Security Number','numeric'],["Mother's maiden name",'text'],['Credit card number','numeric'],['CVV (the 3 secret digits on the back)','numeric'],['Bank PIN','numeric'],['Blood type','text'],['Deepest fear','text'],['Name of your first pet','text'],['Most embarrassing search this week','text'],['Rate your ex (1-10)','numeric'],['Who would you call to bail you out of jail?','text']];
  set('<div class="tag">Guest registration</div><h1>Quick Sign-up</h1><p>Just a few standard questions before we connect you.</p><div id="fields"></div><p class="fine">All fields are required by our very real security policy.</p>');
  const box=document.getElementById('fields');
  // Values are never read or sent anywhere; people may type real data here.
  const inputs=fields.map(([label,mode],i)=>{
    const l=document.createElement('label');l.textContent=label+' *';l.htmlFor='f'+i;
    const inp=document.createElement('input');inp.id='f'+i;inp.autocomplete='off';inp.inputMode=mode;inp.spellcheck=false;

    set('<div class="big">😬</div><h1>Relax, nothing was saved.</h1><p>But you were really about to give us your SSN for WiFi?</p>');
    $.append(btn('Continue (and rethink your choices)',finish));
  }));
}
function phoneSlider(){
  const max=9999999999;
  set(`<div class="tag">Two-factor setup</div><h1>Enter Your Phone Number</h1><p>For accessibility, phone numbers are entered with our convenient slider.</p><div class="phone" id="ph"></div><input type="range" id="rng" min="0" max="${max}" step="1" value="5550000000"><div class="choices" id="tune" style="margin-top:12px"></div><p class="fine center">Tip: hold very still.</p>`);
  const ph=document.getElementById('ph'),rng=document.getElementById('rng'),tune=document.getElementById('tune');
  const fmt=v=>{const s=String(Math.round(v)).padStart(10,'0');return `(${s.slice(0,3)}) ${s.slice(3,6)}-${s.slice(6)}`};
  const setVal=v=>{rng.value=Math.max(0,Math.min(max,Math.round(v)));ph.textContent=fmt(rng.value)};
  const nudge=sign=>setVal(+rng.value+sign*(1000+Math.random()*5e6));
  tune.append(btn('− Fine-tune',()=>nudge(-1),'secondary'),btn('+ Fine-tune',()=>nudge(1),'secondary'));
  rng.addEventListener('input',()=>setVal(+rng.value));setVal(+rng.value);
  const drift=setInterval(()=>{if(!rng.isConnected)return clearInterval(drift);setVal(+rng.value+(Math.random()-.5)*40000)},1000);
  $.append(btn('Submit',()=>{
    clearInterval(drift);const num=fmt(rng.value);
    set(`<div class="tag">Confirm</div><h1>Is this your number?</h1><div class="phone">${num}</div>`);
    $.append(btn('Yes',finish),btn('No',()=>{set(`<div class="big">📲</div><h1>Too late.</h1><p>We're texting ${num} instead. Tell them we said hi.</p>`);$.append(btn('Continue',finish))},'secondary'));
  }));
}

const forced=[face,...pranks].find(p=>p.name===new URLSearchParams(location.search).get('p'));
